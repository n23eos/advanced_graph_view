name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -noEmit -skipLibCheck

      - name: Test
        run: npx vitest run

      # Catches bundler-only breakage (worker inlining, imports) that tsc misses.
      - name: Build
        run: node esbuild.config.mjs production

      - name: Check manifest and package versions agree
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$manifest" != "$pkg" ]; then
            echo "::error::version mismatch: manifest.json=$manifest package.json=$pkg"
            exit 1
          fi
          echo "version $manifest"
